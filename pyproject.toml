[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "noterpiper"
version = "1.0.0"
description = "A free, serverless notification engine with a plugin ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zulqarnain-cc34" }]
keywords = ["notifications", "serverless", "plugins", "ntfy", "prayer", "habitica"]
# The core engine is stdlib-only. A plugin may declare its own dependencies in its
# own package — they never leak into the core.
dependencies = []

[project.urls]
Homepage = "https://github.com/Zulqarnain-cc34/NoterPiper"

[tool.setuptools.packages.find]
where = ["src"]

# ─── Plugin authors ───
# A pip-installed plugin registers itself under the "noterpiper.plugins" entry-point
# group; the engine auto-discovers it (see PLUGIN-AUTHORING.md). In your plugin's
# pyproject.toml:
#
#   [project.entry-points."noterpiper.plugins"]
#   weather = "noterpiper_weather:WeatherSource"

# ─── Lint + format (Ruff) ───
[tool.ruff]
line-length = 100
target-version = "py310"
# Don't touch Python snippets inside Markdown docs — they're hand-aligned for teaching
# (aligned inline comments), not real source, and ruff would expand them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Built on the community "recommended" tier (E/W/F/I/B/C4/UP/SIM/RUF) plus three
# zero-noise guards (PIE, PGH, FLY). Chosen against this codebase — each either fires
# clean today or only guards future code.
#   E,W  pycodestyle      F   pyflakes        I   isort           UP  pyupgrade
#   B    bugbear          C4  comprehensions  SIM simplify        RUF ruff-specific
#   PIE  misc lints       PGH blanket-noqa/eval guards            FLY  f-string
#
# Deliberately OFF (would fight this project's design, not catch bugs):
#   ANN/D  — light annotations & prose docstrings are a style choice here, not a gap
#   S      — asserts in tests and stdlib urllib are intended, not "insecure"
#   ARG    — the Source.check(self, now, config) protocol has intentionally-unused args
#   TRY/BLE/EM — the crash-proof `except Exception` design is deliberate
#   PLR/N/FBT  — magic-value / naming / bool-arg churn with no safety payoff
#   COM/Q/ISC001 — the formatter already owns these
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "PIE", "RUF", "PGH", "FLY"]
ignore = [
    "E501",    # line width is the formatter's job — don't hard-fail long strings/comments
    "RUF012",  # plugin `defaults`/`config_schema` are read-only config; ClassVar is ceremony, not safety
    "RUF001",  # "—", "→", "·" etc. in strings are intentional typography, not homoglyph bugs
    "RUF002",  # …same, in docstrings
    "RUF003",  # …same, in comments
]
