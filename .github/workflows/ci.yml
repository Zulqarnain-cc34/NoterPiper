name: CI

on:
  push:
    branches: [main]       # PRs are covered by pull_request — no duplicate pipelines
    paths-ignore:
      - config.json        # settings saves from the phone page are data, not code
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes the running pipeline — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check                   # lint gate (E/F/I/UP/B/W)
      - run: ruff format --check          # fail if anything isn't ruff-formatted
      - run: python -m pytest -q          # pipeline (Python stdlib)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test docs/            # config page (pure-logic tests)
      - run: npx --yes @biomejs/biome@2.6.8 ci   # config-page JS: lint + format gate

  # The config page in a real (headless) browser: real DOM + autosave + send buttons
  # against a stubbed GitHub/Aladhan backend (e2e/helpers.mjs). Catches the wiring
  # bugs the pure-logic tests can't — reverting toggles, dead buttons, save races.
  page-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      # The browser download (~150 MB) is the slow part — cache it keyed on the
      # playwright version in the lockfile; --with-deps still installs apt libs fast.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: node --test e2e/
