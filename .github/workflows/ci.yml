name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check                   # lint gate (E/F/I/UP/B/W)
      - run: ruff format --check          # fail if anything isn't ruff-formatted
      - run: python -m pytest -q          # pipeline (Python stdlib)
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --test docs/            # config page (pure-logic tests)
      - run: npx --yes @biomejs/biome@2.6.8 ci   # config-page JS: lint + format gate
