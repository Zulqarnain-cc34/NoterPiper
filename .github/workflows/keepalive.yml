name: Keepalive

# GitHub pauses scheduled workflows after 60 days of no repo activity. This runs
# monthly and makes a tiny commit so the dashboard / notifications / prayer jobs
# keep running forever with zero effort from you.

on:
  schedule:
    - cron: "0 3 1 * *"   # 03:00 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch a heartbeat file and commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keepalive" || echo "nothing to commit"
          git push
