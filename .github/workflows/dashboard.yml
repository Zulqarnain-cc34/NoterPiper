name: Habitica Dashboard

# No-server, always-on dashboard:
#   GitHub Actions (free scheduled runner) pulls your Habitica data via the API,
#   builds a static HTML dashboard, and publishes it to GitHub Pages.
# Your token lives ONLY as the encrypted secret HABITICA_API_TOKEN — never in code.
#
# One-time setup:
#   1. Repo → Settings → Secrets and variables → Actions → add:
#        HABITICA_API_TOKEN  (your API token)
#        HABITICA_USER_ID    (your Habitica User ID)
#   2. Repo → Settings → Pages → Source: "GitHub Actions".
#   3. Run it from the Actions tab (or wait for the daily schedule).

on:
  schedule:
    - cron: "30 19 * * *"   # ~00:30 Pakistan time (19:00 UTC) daily
  workflow_dispatch:         # manual "Run" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HABITICA_API_TOKEN: ${{ secrets.HABITICA_API_TOKEN }}
      HABITICA_USER_ID: ${{ secrets.HABITICA_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull live Habitica data (read-only)
        run: python scripts/sync_from_api.py
      - name: Build static dashboard
        run: |
          mkdir -p site
          jupyter nbconvert --to html --execute --no-input \
            --output index --output-dir site \
            notebooks/recitations_dashboard.ipynb
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
