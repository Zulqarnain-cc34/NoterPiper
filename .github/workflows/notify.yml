name: Habitica Notifications

# No-server notifications: GitHub Actions runs once a day, checks what's not
# logged + streaks at risk, and pushes to your phone via ntfy.sh.
# Secrets needed: HABITICA_API_TOKEN, HABITICA_USER_ID, NTFY_TOPIC.
# Subscribe to the same NTFY_TOPIC in the free ntfy app to receive the push.
#
# Timing note: GitHub's scheduled runs can be 5–30 min late — fine for a
# once-a-day "before midnight" nudge, not for exact prayer-time alerts.

on:
  workflow_dispatch:         # the on-demand "send nudge now" button
    inputs:
      kind:                  # which nudge format to send — the test page's per-phase buttons
        description: "Which nudge to send"
        type: choice
        options: [evening, morning, weekly]
        default: evening
  # The *scheduled* nightly nudge is handled by the engine (prayers.yml runs every
  # plugin on its ~2-min trigger). This workflow is just the manual button.

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      HABITICA_API_TOKEN: ${{ secrets.HABITICA_API_TOKEN }}
      HABITICA_USER_ID: ${{ secrets.HABITICA_USER_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      PRAYER_TIMEZONE: ${{ vars.PRAYER_TIMEZONE }}   # the nudge's local-time clock
      FORCE_SOURCE: habitica                         # force just the nudge, now, bypassing its time gate
      FORCE_KIND: ${{ inputs.kind || 'evening' }}    # evening | morning | weekly (choice-restricted input)
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}         # optional 2nd channel, if configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Optional: install any third-party (pip) plugins the deployer listed.
      - run: '[ -f plugins-requirements.txt ] && pip install -r plugins-requirements.txt || echo "no third-party plugins"'
      # run_engine.py forces just the Habitica nudge; core is stdlib, plugins bring their own deps.
      - run: python scripts/run_engine.py

      # Push an urgent alert (and GitHub emails you too) if the nightly job breaks.
      - name: Alert me if this job failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WF: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s --max-time 20 \
            -H "Title: NoterPiper failed: ${WF}" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -d "The '${WF}' run failed. Tap for logs: ${RUN_URL}" \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
