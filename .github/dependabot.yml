# Keep the dev tooling and CI actions current. The app itself has no runtime
# dependencies (stdlib-only Python, vanilla-JS page) — the only moving parts are
# the e2e harness's Playwright and the Actions pinned in the workflows.
version: 2
updates:
  # The browser-test harness (package.json → playwright).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    groups:
      playwright:
        patterns: ["*"]

  # actions/checkout, setup-node, setup-python, cache — pinned to major tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
