<svg viewBox="0 0 680 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <rect width="680" height="430" rx="20" fill="#f8fafc"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#0f172a">What happens in one run</text>
  <text x="40" y="62" font-size="13" fill="#64748b">every ~2 minutes, start to finish</text>

  <line x1="60" y1="104" x2="60" y2="384" stroke="#c7d2fe" stroke-width="3"/>

  <circle cx="60" cy="104" r="20" fill="#6366f1"/>
  <text x="60" y="111" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="100" y="99" font-size="15.5" font-weight="700" fill="#0f172a">A free timer wakes the engine</text>
  <text x="100" y="120" font-size="12.5" fill="#64748b">every ~2 minutes — nothing runs on your devices</text>

  <circle cx="60" cy="174" r="20" fill="#6366f1"/>
  <text x="60" y="181" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="100" y="169" font-size="15.5" font-weight="700" fill="#0f172a">It asks each source: "anything due now?"</text>
  <text x="100" y="190" font-size="12.5" fill="#64748b">prayer, habitica, and any you add — one by one</text>

  <circle cx="60" cy="244" r="20" fill="#6366f1"/>
  <text x="60" y="251" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="100" y="239" font-size="15.5" font-weight="700" fill="#0f172a">A source answers — or stays quiet</text>
  <text x="100" y="260" font-size="12.5" fill="#64748b">e.g. "Maghrib — time to pray"  ·  or nothing</text>

  <circle cx="60" cy="314" r="20" fill="#6366f1"/>
  <text x="60" y="321" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="100" y="309" font-size="15.5" font-weight="700" fill="#0f172a">The engine checks: already sent today?</text>
  <text x="100" y="330" font-size="12.5" fill="#64748b">if yes, skip it — so you're never told twice</text>

  <circle cx="60" cy="384" r="20" fill="#14b8a6"/>
  <text x="60" y="391" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="100" y="379" font-size="15.5" font-weight="700" fill="#0f172a">It hands the message to every channel</text>
  <text x="100" y="400" font-size="12.5" fill="#64748b">your phone (ntfy), Discord, email… all at once</text>
</svg>
