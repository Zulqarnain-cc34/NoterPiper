<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arw" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1000" height="360" rx="20" fill="#f8fafc"/>

  <!-- trigger -->
  <rect x="340" y="22" width="230" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="455" y="44" text-anchor="middle" font-size="14.5" font-weight="600" fill="#4338ca">a free timer — every ~2 min</text>
  <path d="M455,56 L455,88" stroke="#94a3b8" stroke-width="2" marker-end="url(#arw)"/>

  <!-- SOURCES -->
  <rect x="40" y="90" width="210" height="236" rx="16" fill="#ffffff" stroke="#fde68a" stroke-width="1.5"/>
  <path d="M40 106 Q40 90 56 90 L234 90 Q250 90 250 106 L250 136 L40 136 Z" fill="#f59e0b"/>
  <text x="145" y="119" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">SOURCES</text>
  <text x="145" y="158" text-anchor="middle" font-size="12.5" fill="#92400e">decide WHAT to tell you</text>
  <rect x="60" y="176" width="170" height="52" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="76" y="198" font-size="14.5" font-weight="600" fill="#0f172a">Prayer</text>
  <text x="76" y="217" font-size="11.5" fill="#64748b">five daily reminders</text>
  <rect x="60" y="242" width="170" height="52" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <text x="76" y="264" font-size="14.5" font-weight="600" fill="#0f172a">Habitica</text>
  <text x="76" y="283" font-size="11.5" fill="#64748b">nightly nudge</text>

  <path d="M250,208 L300,208" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- ENGINE -->
  <rect x="300" y="90" width="210" height="236" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5"/>
  <path d="M300 106 Q300 90 316 90 L494 90 Q510 90 510 106 L510 136 L300 136 Z" fill="#6366f1"/>
  <text x="405" y="119" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">ENGINE</text>
  <text x="405" y="158" text-anchor="middle" font-size="12.5" fill="#3730a3">collect &amp; route</text>
  <text x="322" y="192" font-size="13" fill="#0f172a">asks each source</text>
  <text x="336" y="210" font-size="11.5" fill="#64748b">"anything due now?"</text>
  <text x="322" y="240" font-size="13" fill="#0f172a">removes duplicates</text>
  <text x="322" y="270" font-size="13" fill="#0f172a">fans out to channels</text>

  <path d="M510,208 L560,208" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- CHANNELS -->
  <rect x="560" y="90" width="210" height="236" rx="16" fill="#ffffff" stroke="#99f6e4" stroke-width="1.5"/>
  <path d="M560 106 Q560 90 576 90 L754 90 Q770 90 770 106 L770 136 L560 136 Z" fill="#14b8a6"/>
  <text x="665" y="119" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">CHANNELS</text>
  <text x="665" y="158" text-anchor="middle" font-size="12.5" fill="#115e59">decide HOW to deliver</text>
  <rect x="580" y="176" width="170" height="52" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="596" y="198" font-size="14.5" font-weight="600" fill="#0f172a">ntfy</text>
  <text x="596" y="217" font-size="11.5" fill="#64748b">push to your phone</text>
  <rect x="580" y="242" width="170" height="52" rx="10" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="596" y="264" font-size="14.5" font-weight="600" fill="#0f172a">webhook</text>
  <text x="596" y="283" font-size="11.5" fill="#64748b">Discord, Slack, …</text>

  <path d="M770,208 L820,208" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arw)"/>

  <!-- YOU -->
  <rect x="832" y="150" width="112" height="150" rx="18" fill="#1e293b"/>
  <rect x="846" y="166" width="84" height="104" rx="6" fill="#0f172a"/>
  <path d="M888 196 c-9 0 -16 7 -16 17 l0 10 c0 5 -2 8 -6 11 l44 0 c-4 -3 -6 -6 -6 -11 l0 -10 c0 -10 -7 -17 -16 -17 Z" fill="#818cf8"/>
  <path d="M882 236 a6 6 0 0 0 12 0 Z" fill="#818cf8"/>
  <circle cx="888" cy="284" r="5" fill="#334155"/>
  <text x="888" y="326" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0f172a">You</text>
</svg>
