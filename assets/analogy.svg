<svg viewBox="0 0 980 420" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="aa" markerWidth="12" markerHeight="12" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="980" height="420" rx="20" fill="#f8fafc"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#0f172a">The tireless assistant</text>
  <text x="40" y="61" font-size="13" fill="#64748b">how a reminder actually reaches you</text>

  <!-- group labels -->
  <text x="112" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1">HELPERS</text>
  <text x="460" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#4338ca" letter-spacing="1">THE ASSISTANT</text>
  <text x="727" y="92" text-anchor="middle" font-size="11" font-weight="700" fill="#0f766e" letter-spacing="1">CHANNELS</text>

  <!-- helper: Prayer -->
  <circle cx="112" cy="150" r="18" fill="#f59e0b"/>
  <path d="M88 196 a24 24 0 0 1 48 0 Z" fill="#f59e0b"/>
  <text x="112" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Prayer</text>
  <rect x="150" y="128" width="132" height="36" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <path d="M150 150 L138 146 L138 154 Z" fill="#fffbeb"/>
  <text x="216" y="151" text-anchor="middle" font-size="12" fill="#0f172a">"Maghrib is due!"</text>

  <!-- helper: Habitica -->
  <circle cx="112" cy="300" r="18" fill="#f59e0b"/>
  <path d="M88 346 a24 24 0 0 1 48 0 Z" fill="#f59e0b"/>
  <text x="112" y="372" text-anchor="middle" font-size="13" font-weight="600" fill="#92400e">Habitica</text>
  <rect x="150" y="278" width="132" height="36" rx="10" fill="#fffbeb" stroke="#fde68a"/>
  <path d="M150 300 L138 296 L138 304 Z" fill="#fffbeb"/>
  <text x="216" y="301" text-anchor="middle" font-size="12" fill="#0f172a">"3 left to log"</text>

  <!-- arrows helpers -> assistant -->
  <path d="M292 150 C 350 160, 360 185, 404 184" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#aa)"/>
  <path d="M292 300 C 350 290, 360 200, 404 192" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#aa)"/>

  <!-- assistant question bubble -->
  <rect x="318" y="106" width="284" height="42" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="460" y="132" text-anchor="middle" font-size="13.5" font-weight="600" fill="#3730a3">"Anything to tell them right now?"</text>
  <path d="M452 148 L462 160 L472 148 Z" fill="#eef2ff" stroke="#c7d2fe"/>

  <!-- assistant -->
  <circle cx="460" cy="188" r="22" fill="#6366f1"/>
  <path d="M426 244 a34 34 0 0 1 68 0 Z" fill="#6366f1"/>
  <text x="460" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#3730a3">the engine</text>
  <rect x="396" y="286" width="128" height="24" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="460" y="302" text-anchor="middle" font-size="11" fill="#4338ca">asks again every ~2 min</text>

  <!-- arrows assistant -> channels -->
  <text x="575" y="126" text-anchor="middle" font-size="11" fill="#64748b">hands it to every channel</text>
  <path d="M496 180 L632 164" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#aa)"/>
  <path d="M496 196 L632 258" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#aa)"/>

  <!-- channels -->
  <rect x="634" y="146" width="184" height="46" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="654" y="168" font-size="14" font-weight="600" fill="#0f172a">ntfy</text>
  <text x="654" y="184" font-size="11.5" fill="#64748b">pushes to your phone</text>
  <rect x="634" y="238" width="184" height="46" rx="12" fill="#f0fdfa" stroke="#99f6e4"/>
  <text x="654" y="260" font-size="14" font-weight="600" fill="#0f172a">webhook</text>
  <text x="654" y="276" font-size="11.5" fill="#64748b">Discord, Slack, email…</text>

  <!-- arrows channels -> you -->
  <path d="M818 169 L862 196" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#aa)"/>
  <path d="M818 261 L862 212" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#aa)"/>

  <!-- you -->
  <rect x="868" y="150" width="76" height="112" rx="14" fill="#1e293b"/>
  <rect x="879" y="164" width="54" height="74" rx="5" fill="#0f172a"/>
  <path d="M906 186 c-8 0 -14 6 -14 15 l0 8 c0 4 -2 7 -5 9 l38 0 c-3 -2 -5 -5 -5 -9 l0 -8 c0 -9 -6 -15 -14 -15 Z" fill="#818cf8"/>
  <path d="M901 220 a5 5 0 0 0 10 0 Z" fill="#818cf8"/>
  <circle cx="906" cy="250" r="4" fill="#334155"/>
  <text x="906" y="284" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">You</text>
</svg>
